name: Deploy to AWS Lightsail

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            
            echo "📦 Starting deployment..."
            cd /var/www/makanview

            # Pull latest code
            echo "→ Pulling latest code..."
            git pull origin main

            # Install dependencies (use ci for faster, cleaner installs)
            echo "→ Installing dependencies..."
            npm ci --production=false

            # Generate Prisma client
            echo "→ Generating Prisma client..."
            npx prisma generate

            # Apply any new database migrations (PostgreSQL)
            echo "→ Running database migrations..."
            npx prisma migrate deploy

            # Ensure uploads directory exists (for non-S3 fallback)
            mkdir -p public/uploads

            # Build the Next.js app
            echo "→ Building Next.js app..."
            npm run build

            # Stop PM2 before restart to avoid restart loops
            echo "→ Stopping PM2..."
            pm2 stop makanview || true

            # Delete old PM2 process
            pm2 delete makanview || true

            # Start fresh with PM2
            echo "→ Starting PM2..."
            pm2 start ecosystem.config.js
            pm2 save

            # Show status
            echo "→ PM2 Status:"
            pm2 status

            echo "✅ Deployment complete!"
