name: Deploy to AWS Lightsail

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            cd /var/www/makanview

            # Pull latest code
            git pull origin main

            # Install dependencies
            npm install --production=false

            # Generate Prisma client
            npx prisma generate

            # Apply any new database migrations (PostgreSQL)
            npx prisma migrate deploy

            # Ensure uploads directory exists (for non-S3 fallback)
            mkdir -p public/uploads

            # Build the Next.js app
            npm run build

            # Restart with PM2 cluster mode (zero-downtime reload)
            if pm2 describe makanview > /dev/null 2>&1; then
              pm2 reload ecosystem.config.js
            else
              pm2 start ecosystem.config.js
              pm2 save
            fi

            echo "✅ Deployment complete!"
